<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .profile-card {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            background: white;
        }

        .profile-header {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
        }

        .profile-body {
            padding: 2rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .info-label {
            color: #64748b;
            font-weight: 500;
        }

        .info-value {
            font-weight: 600;
            color: #1e293b;
        }

        .btn-edit {
            border-radius: 10px;
            padding: 0.5rem 1.2rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="profile-card">

                <!-- Header -->
                <div class="profile-header">

                    <h3 class="mt-3" th:text="${user.username}">Name</h3>
                    <p class="mb-0" th:text="${user.email}">email@example.com</p>
                </div>

                <!-- Body -->
                <div class="profile-body">

                    <div class="info-item">
                        <span class="info-label"><i class="bi bi-person"></i> Full Name</span>
                        <span class="info-value" th:text="${user.username}">John Doe</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label"><i class="bi bi-envelope"></i> Email</span>
                        <span class="info-value" th:text="${user.email}">john@email.com</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label"><i class="bi bi-telephone"></i> Phone</span>
                        <span class="info-value" th:text="${user.number}">09123456789</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label"><i class="bi bi-credit-card"></i> Account No</span>
                        <span class="info-value" >123456789</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label"><i class="bi bi-wallet2"></i> Balance</span>
                        <span class="info-value" th:text ="${account.balance}" >₱0.00</span>
                    </div>

                    <div class="text-center mt-4">
                        <a href="/edit-profile" class="btn btn-primary btn-edit">
                            <i class="bi bi-pencil"></i> Edit Profile
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
