<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ledge-It | Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        .navbar {
            background: #0f172a;
        }

        .card {
            border-radius: 16px;
            border: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .balance-card {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
        }

        .quick-action-btn {
            border-radius: 12px;
        }

        .amount-positive {
            color: #16a34a;
            font-weight: 600;
        }

        .amount-negative {
            color: #dc2626;
            font-weight: 600;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark px-4">
    <span class="navbar-brand">Ledge-It Bank</span>

    <div class="text-white">
        Welcome, <span th:text="${user.username}">User</span>
        <a href="/logout" class="btn btn-sm btn-outline-light ms-3">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <!-- BALANCE + ACTIONS -->
    <div class="row g-4">

        <!-- Balance -->
        <div class="col-md-6">
            <div class="card balance-card p-4">
                <h6>Current Balance</h6>
                <h2>₱ <span th:text="${account.balance}">10,000.00</span></h2>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="col-md-6">
            <div class="card p-4">
                <h6 class="mb-3">Quick Actions</h6>

                <div class="d-grid gap-2">
                    <button class="btn btn-primary quick-action-btn" data-bs-toggle="modal" data-bs-target="#transferModal">
                        Transfer
                    </button>

                    <button class="btn btn-success quick-action-btn" data-bs-toggle="modal" data-bs-target="#depositModal">
                        Deposit
                    </button>

                    <button class="btn btn-warning quick-action-btn" data-bs-toggle="modal" data-bs-target="#withdrawModal">
                        Withdraw
                    </button>

                </div>
            </div>
        </div>

    </div>

    <!-- TRANSACTIONS -->
    <div class="card mt-4 p-4">
        <h5 class="mb-3">Recent Transactions</h5>

        <div th:if="${#lists.isEmpty(transactions)}" class="text-muted">
            No transactions yet.
        </div>

        <div th:each="txn : ${transactions}"
             class="d-flex justify-content-between align-items-center border-bottom py-2">

            <!-- LEFT SIDE -->
            <div>

                <!-- Transaction Type -->
                <strong th:text="${txn.type}">Deposit</strong>

                <!-- DATE FORMATTED -->
                <br>
                <small class="text-muted"
                       th:text="${#temporals.format(txn.date, 'MMM dd, yyyy • hh:mm a')}">
                    Jan 01, 2026 • 10:30 AM
                </small>

                <!-- OPTIONAL: PARTY INFO -->
                <br>
                <small class="text-muted">

                    <!-- SEND -->
                    <span th:if="${txn.type == 'Transfer Out' or txn.type == 'Transfer'}">
                    To: <span th:text="${txn.to_number}">09123456789</span>
                </span>

                    <!-- RECEIVE -->
                    <span th:if="${txn.type == 'Transfer In' or txn.type == 'Receive'}">
                    From: <span th:text="${txn.from_number}">09876543210</span>
                </span>

                </small>

            </div>

            <!-- RIGHT SIDE (AMOUNT) -->
            <div th:classappend="${txn.amount > 0} ? 'amount-positive' : 'amount-negative'">
                ₱ <span th:text="${#numbers.formatDecimal(txn.amount, 1, 'COMMA', 2, 'POINT')}">
                500.00
            </span>
            </div>

        </div>
    </div>

</div>
<!-- ========================= -->
<!-- TRANSFER MODAL -->
<!-- ========================= -->
<div class="modal fade" id="transferModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <form th:action="@{/transfer}" method="post">

                <!-- Header -->
                <div class="modal-header">
                    <h5 class="modal-title">Transfer Money</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- Body -->
                <div class="modal-body">

                    <!-- Recipient -->
                    <div class="mb-3">
                        <label class="form-label">Recipient Mobile Number</label>
                        <input type="text" name="to_number" class="form-control"
                               placeholder="Enter recipient mobile number" required>
                    </div>

                    <!-- Amount -->
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" name="amount" class="form-control"
                               placeholder="Enter amount" required>
                    </div>


                </div>

                <!-- Footer -->
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary w-100">
                        Confirm Transfer
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- ========================= -->
<!-- DEPOSIT MODAL -->
<!-- ========================= -->
<div class="modal fade" id="depositModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <form th:action="@{/deposit}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Deposit Funds</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label>Amount</label>
                        <input type="number" step="0.01" name="amount" class="form-control" required>
                    </div>


                </div>

                <div class="modal-footer">
                    <button class="btn btn-success w-100">Confirm Deposit</button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- ========================= -->
<!-- WITHDRAW MODAL -->
<!-- ========================= -->
<div class="modal fade" id="withdrawModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/withdraw}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Withdraw Funds</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label>Amount</label>
                        <input type="number" step="0.01" name="amount" class="form-control" required>
                    </div>


                </div>

                <div class="modal-footer">
                    <button class="btn btn-warning w-100">Confirm Withdrawal</button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- ===================== -->
<!-- TOAST CONTAINER -->
<!-- ===================== -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">

    <!-- SUCCESS TOAST -->
    <div th:if="${success}" class="toast align-items-center text-bg-success border-0 show"
         role="alert" aria-live="assertive" aria-atomic="true">

        <div class="d-flex">
            <div class="toast-body">
                <span th:text="${success}">Success message</span>
            </div>

            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

    <!-- ERROR TOAST -->
    <div th:if="${error}" class="toast align-items-center text-bg-danger border-0 show"
         role="alert" aria-live="assertive" aria-atomic="true">

        <div class="d-flex">
            <div class="toast-body">
                <span th:text="${error}">Error message</span>
            </div>

            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

</div>

<!-- Bootstrap JS (REQUIRED for modals) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toastElList = [].slice.call(document.querySelectorAll('.toast'));
        toastElList.forEach(function (toastEl) {
            const toast = new bootstrap.Toast(toastEl, {
                delay: 3000,   // 3 seconds
                autohide: true
            });
            toast.show();
        });
    });
</script>
</body>
</html>
