<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ledge-It | Sign Up</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .brand {
            font-weight: 600;
            font-size: 1.5rem;
            color: #0f172a;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #64748b;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-primary {
            border-radius: 10px;
            background-color: #2563eb;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .footer-text {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 15px;
        }

        .link-text {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
        }

        .link-text a {
            color: #2563eb;
            text-decoration: none;
        }

        .link-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">

    <!-- HEADER -->
    <div class="text-center mb-4">
        <div class="brand">Ledge-It</div>
        <div class="subtitle">Create your banking account</div>
    </div>

    <!-- SIGN UP FORM -->
    <form th:action="@{/signup}" method="post">

        <!-- ERROR -->
        <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}">Signup failed</span>
        </div>

        <!-- FULL NAME -->
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <!-- MOBILE NUMBER -->
        <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="text" name="number" class="form-control" placeholder="09XXXXXXXXX" required>
        </div>

        <!-- EMAIL (optional but good for banking apps) -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter your email">
        </div>

        <!-- PIN -->
        <div class="mb-3">
            <label class="form-label">Create PIN</label>
            <input type="password" name="pin" class="form-control" placeholder="4-6 digit PIN" required>
        </div>

        <!-- CONFIRM PIN -->
        <div class="mb-3">
            <label class="form-label">Confirm PIN</label>
            <input type="password" name="confirmPin" class="form-control" placeholder="Re-enter PIN" required>
        </div>

        <!-- SUBMIT -->
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Create Account</button>
        </div>

    </form>

    <!-- LOGIN LINK -->
    <div class="link-text">
        Already have an account?
        <a th:href="@{/login}">Login</a>
    </div>

    <div class="footer-text">
        © 2026 Ledge-It. All rights reserved.
    </div>

</div>

</body>
</html>
